<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 365" width="290" height="365"><title>Razzle Messenger with fictional contacts</title><foreignObject width="290" height="365"><div xmlns="http://www.w3.org/1999/xhtml"><style><![CDATA[
:root{--brand:#0033A0;--blue:#00205B;--deep:#2468D7;--navy:#00205B;--ink:#12213F;--sky:#00A3E0;--bub:rgba(74,183,242,.58);--line:#d5e2f0;--pale:#eaf3fd;--mid:#cfe3fa;--muted:#5b6b85;--acc:#FFCE00;
 --sys:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#F4F9FF,#DCEBFC) fixed;font:12px Tahoma,Verdana,Arial,sans-serif;color:var(--ink)}
.win{background:#f3f6fa;border:1px solid var(--deep);border-radius:7px 7px 3px 3px;box-shadow:0 4px 16px rgba(15,79,154,.35);overflow:hidden}
.tbar{background:linear-gradient(#00A3E0,#0033A0 55%,#2468D7);color:#fff;font-weight:bold;padding:5px 8px;display:flex;align-items:center;gap:6px;text-shadow:0 1px 1px rgba(0,0,0,.4);user-select:none}
.tbar .sp{flex:1}.wb{width:18px;height:16px;border:1px solid #fff;border-radius:3px;background:rgba(255,255,255,.2);font:bold 10px Tahoma;text-align:center;line-height:13px;cursor:pointer}.wb.x{background:#d9534f}
button{font:12px Tahoma;background:linear-gradient(#fff,#e3ecf7);border:1px solid #7f9db9;border-radius:3px;padding:3px 10px;cursor:pointer;color:var(--ink)}button:hover{border-color:var(--blue)}button:disabled{opacity:.5;cursor:default}
button.pri{background:linear-gradient(#ffe066,#ffc400);border-color:#c79a00;font-weight:bold}
input[type=text],input[type=password],input[type=email],select,textarea{font:12px Tahoma;border:1px solid #7f9db9;padding:4px;border-radius:2px}
.logo{font:800 30px var(--sys);letter-spacing:-.5px;line-height:1}.logo .a{color:var(--brand)}.logo .b{color:var(--navy)}
#mwin{position:fixed;left:16px;top:16px;width:290px;height:calc(100vh - 32px);max-height:680px;display:flex;flex-direction:column;z-index:5}
#menu{display:flex;background:#f3f6fa;border-bottom:1px solid var(--line);padding:1px 4px;position:relative;z-index:30}
#menu>div{position:relative;padding:3px 8px;cursor:default}#menu>div:hover,#menu>div.open{background:var(--blue);color:#fff}
#menu .dd{display:none;position:absolute;left:0;top:100%;background:#fff;color:var(--ink);border:1px solid #7f9db9;box-shadow:2px 2px 5px rgba(0,0,0,.25);min-width:180px;padding:2px 0}
#menu>div.open .dd{display:block}#menu .dd div{padding:4px 16px;white-space:nowrap}#menu .dd div:hover{background:var(--blue);color:#fff}#menu hr{border:0;border-top:1px solid var(--line);margin:2px 0}
/* sign-in */
#signin{flex:1;display:flex;flex-direction:column;align-items:center;padding:22px 18px;gap:8px;background:linear-gradient(#fff,#eaf3fd)}
#signin label{align-self:stretch;font-weight:bold;color:var(--navy)}#signin input[type=text],#signin input[type=password],#signin input[type=email]{width:100%}
#signin .row{align-self:stretch;display:flex;align-items:center;gap:6px}
.err{color:#c00;min-height:15px;align-self:stretch}.ok{color:#080}.note{background:#fff6c8;border:1px solid #e6c84a;padding:8px;border-radius:4px;align-self:stretch}
a{color:var(--blue);cursor:pointer}
/* main */
#main{flex:1;display:none;flex-direction:column;min-height:0}
#me{display:flex;gap:8px;padding:8px;background:linear-gradient(#fff,#eaf3fd);border-bottom:1px solid var(--line)}
.av{width:48px;height:48px;border:1px solid #7f9db9;border-radius:4px;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.av .rcw{zoom:1.7}.av.sm{width:26px;height:26px;cursor:default}.av.sm .rcw{zoom:1}
#me .info{flex:1;min-width:0}#me .nm{font-weight:bold;font-size:14px;color:var(--navy);overflow:hidden;text-overflow:ellipsis}
#stsel{margin:3px 0;max-width:100%}#smsg{width:100%;font-size:11px;color:var(--muted)}
#search{margin:5px 6px;display:flex;gap:4px}#q{flex:1}
#tabs{display:flex;padding:0 6px}#tabs div{padding:3px 10px;border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;background:#e8eef6;cursor:pointer}#tabs .on{background:#fff;font-weight:bold}
#list{flex:1;overflow:auto;background:#fff;margin:0 6px;border:1px solid #7f9db9}
.grp{font-weight:bold;color:var(--deep);padding:3px 4px;cursor:pointer;background:#f3f7fc;border-bottom:1px solid var(--line);user-select:none}.grp:before{content:"\25BE ";}.grp.closed:before{content:"\25B8 ";}
.ct{display:flex;align-items:center;gap:6px;padding:3px 6px 3px 14px;cursor:default;user-select:none}.ct:hover{background:var(--pale)}.ct.sel{background:var(--mid)}
.ct .t{flex:1;min-width:0}.ct .n{font-weight:bold}.ct.off .n{color:#888;font-weight:normal}.ct .sm{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.35);flex:none}
.d-available{background:radial-gradient(circle at 35% 35%,#b9f5a0,#2db52d)}.d-busy{background:radial-gradient(circle at 35% 35%,#ffb3a8,#d9251c)}.d-away,.d-brb,.d-idle{background:radial-gradient(circle at 35% 35%,#fff2a0,#e0a800)}
.d-offline,.d-invisible{background:#ccc}
#reqs .rq{background:#fff6c8;border-bottom:1px solid #e6c84a;padding:5px 6px}#reqs .rq button{padding:1px 8px;margin-right:4px}
#bottom{display:flex;gap:4px;padding:6px;flex-wrap:wrap;border-top:1px solid var(--line)}#bottom button{flex:1;padding:4px 2px}
#foot{font-size:10px;color:var(--muted);text-align:center;padding:2px 0 5px}
/* IM windows */
.im{position:fixed;width:400px;display:flex;flex-direction:column;z-index:10}.im .tbar{cursor:move}
.im .tools{display:flex;gap:2px;padding:3px 4px;border-bottom:1px solid var(--line);background:linear-gradient(#fff,#eef4fb)}
.tb{display:flex;flex-direction:column;align-items:center;font-size:10px;padding:1px 6px;border:1px solid transparent;border-radius:3px;background:none;min-width:46px}.tb span{font-size:18px;line-height:22px}.tb:hover{border-color:#7f9db9;background:var(--pale)}.tb.on{background:var(--mid);border-color:var(--deep)}
.im .peer{display:flex;align-items:center;gap:6px;padding:4px 6px;font-size:11px;color:var(--muted)}
.im .log{height:210px;overflow:auto;background:#fff;border:1px solid #7f9db9;margin:0 6px;padding:5px;font:13px Arial;line-height:1.4}
.im .log .sys{color:var(--muted);font-style:italic;font-size:11px}.im .log .bz{color:#d00;font-weight:bold}.im .log .ts{color:#999;font-size:10px;margin-right:3px}
.im .typ{height:15px;font-size:11px;color:var(--muted);padding:1px 8px}
.im .fmt{display:flex;align-items:center;gap:5px;padding:2px 6px;position:relative;flex-wrap:wrap}.im .fmt button{padding:0 7px}.im .fmt .on{background:var(--mid);border-color:var(--deep)}
.im .fmt .smb{cursor:pointer;line-height:0}
.sw{display:inline-block;width:12px;height:12px;border:1px solid #555;cursor:pointer}.sw.on{outline:2px solid var(--acc)}
.im form{display:flex;gap:5px;padding:4px 6px 6px}.im textarea{flex:1;height:46px;resize:none}.im form button{width:64px}
.smp{display:none;position:absolute;bottom:24px;left:4px;width:330px;max-height:210px;overflow:auto;background:#fff;border:1px solid var(--deep);box-shadow:2px 2px 6px rgba(0,0,0,.3);padding:4px;z-index:40}.smp.open{display:block}.smp span{cursor:pointer;display:inline-block;padding:2px}
.call{display:none;padding:4px 6px;background:#00205B;color:#fff;gap:6px;align-items:center;flex-wrap:wrap}.call.on{display:flex}
.call video{width:180px;height:135px;background:#000;border:1px solid #00A3E0}.call video.me{width:72px;height:54px}.call .cs{flex:1;min-width:120px}
@keyframes buzz{10%,50%,90%{transform:translate(-7px,2px)}30%,70%{transform:translate(7px,-2px)}}.buzzing{animation:buzz .5s 2}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:99}
.toast{width:250px;background:linear-gradient(#fff,#eaf3fd);border:1px solid var(--deep);border-radius:5px;box-shadow:0 3px 10px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center;padding:8px;animation:tin .3s}
@keyframes tin{from{transform:translateY(30px);opacity:0}}
#avpick{display:none;position:absolute;left:8px;top:110px;background:#fff;border:1px solid var(--deep);padding:6px;z-index:40;box-shadow:2px 2px 6px rgba(0,0,0,.3)}#avpick .av{display:inline-flex;margin:2px}
#modal{display:none;position:fixed;inset:0;background:rgba(16,35,74,.35);z-index:200;align-items:center;justify-content:center}#modal.on{display:flex}
#modal .win{width:320px}#modal .in{padding:12px;display:flex;flex-direction:column;gap:6px;background:#fff}
@media (max-width:760px){#mwin{left:0;top:0;width:100%;height:100vh;max-height:none}.im{left:0!important;top:0!important;width:100%;height:100vh}.im .log{flex:1;height:auto}}
 #mwin{left:0;top:0;width:290px;height:365px} #main{display:flex} body{background:#fff} foreignObject > div{font:12px Tahoma,Verdana,Arial,sans-serif;color:var(--ink)} #mwin{position:absolute} .avw{position:relative} .avw .sdot{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border:1px solid white;border-radius:50%;background:#999} .avw .available{background:#2db52d}.avw .away{background:#d6a400}]]></style><div id="mwin" class="win">
 <div class="tbar"><span class="lgs"></span><span><span class="brandname appname">Razzle</span> Messenger</span><span class="sp"></span><span class="wb">−</span><span class="wb">□</span><span class="wb x" id="wx" title="Sign out">×</span></div>
 <div id="menu">
  <div>Messenger<div class="dd"><div id="mStatus">Change My Status...</div><div id="mAvatar">Change My Avatar...</div><div id="mSound">Sounds: On</div><div id="mShowRoom" title="Let friends see which chat room you are in">&#10003; Show the room I'm in</div><div id="mSet">Settings / Privacy...</div><hr /><div id="mOut">Sign Out</div></div></div>
  <div>Contacts<div class="dd"><div id="mAdd">Add a Contact...</div><div id="mProf">View Profile of Selected</div><div id="mMyProf">Edit My Profile...</div><div id="mGroup" style="display:none"></div><div id="mMove" style="display:none"></div><hr /><div id="mRem">Remove Selected Contact</div><div id="mBlock">Block Selected Contact</div><div id="mBlocked">Blocked List...</div></div></div>
  <div>Actions<div class="dd"><div id="mIm">Send a PM to Selected</div><div id="mBuzz">Buzz Selected</div><div id="mInv">Invite to Room</div><hr /><div id="mRooms">Browse Chat Rooms...</div></div></div>
  <div>Help<div class="dd"><div id="mHelp">Getting Started</div><div id="mAbout">About</div></div></div>
 </div>
  <div id="main">
  <div id="me"><div class="av" id="myav"><span style="font-size:25px;color:#004990">R</span></div><div class="info"><div class="nm" id="myname">Messenger Preview</div>
   <div class="stw"><span class="sdot available" id="stdot"></span><select id="stsel"><option value="available">&#9679; Available</option><option value="busy">&#9679; Busy</option><option value="away">&#9679; Away</option><option value="brb">&#9679; Be Right Back</option><option value="invisible">&#9675; Invisible</option><option disabled="disabled">──────────</option><option value="showroom">&#128172; Show the room I'm in</option></select></div>
   <div class="mind"><input type="text" id="smsg" maxlength="60" placeholder="What's on your mind?" /><i data-i="pencil" data-s="16"></i></div></div></div>
  <div id="avpick"></div>
  <div id="search"><div class="srch"><i data-i="search" data-s="18"></i><input type="text" id="q" placeholder="Search contacts..." /></div></div>
  <div id="tabs"><div class="on">Contacts</div></div>
  <div id="list"><div id="reqs"></div><div id="tree"><div class="grp">Online (2)</div><div class="ct"><span class="avw"><span class="av sm" style="background:#cbddf2">B</span><span class="sdot available"></span></span><div class="t"><div class="n">BirchRelay47</div><div class="sm">Available</div></div></div><div class="ct"><span class="avw"><span class="av sm" style="background:#e8d8f7">C</span><span class="sdot away"></span></span><div class="t"><div class="n">CobaltKettle83</div><div class="sm">Away</div></div></div><div class="grp">Offline (1)</div><div class="ct off"><span class="avw"><span class="av sm" style="background:#e6e9ef">O</span><span class="sdot offline"></span></span><div class="t"><div class="n">OrbitThimble62</div><div class="sm">Offline</div></div></div></div></div>
  <div class="yonline" style="font-size:11px;color:#2a7a2a;text-align:center;padding:2px"></div><div id="bottom"><button class="btn" id="bAdd"><i data-i="user" data-s="18"></i> Add Contact</button><button class="btn pri" id="bRooms"><i data-i="chat" data-s="18"></i> Browse Rooms</button></div>
 </div>
 <div id="foot"><span class="lgs2"></span><span class="brandname appname">Razzle</span></div>
</div>
</div></foreignObject></svg>