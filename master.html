<!doctype html><html><head><meta charset=utf-8><title>Master Console</title><meta name=robots content=noindex>
<style>body{font:13px system-ui,Arial;margin:0;background:#eef2f7;color:#1c2430}header{background:linear-gradient(#2a3d5c,#18263d);color:#fff;padding:10px 16px;font-weight:700;font-size:16px}
nav{display:flex;gap:4px;padding:8px 16px;background:#dfe6f0;border-bottom:1px solid #c5cfdc}nav button{border:1px solid #9fb0c8;background:#fff;padding:6px 12px;border-radius:4px;cursor:pointer}nav button.on{background:#1877e8;color:#fff;border-color:#1877e8}
main{padding:12px 16px}table{border-collapse:collapse;width:100%;background:#fff}td,th{border-bottom:1px solid #e3e8ef;padding:5px 7px;text-align:left;vertical-align:top}th{background:#f4f6fa;position:sticky;top:0}
.on{color:#0a0}.b{font-size:11px;padding:2px 6px;margin:1px;border:1px solid #aab;border-radius:3px;background:#fafbfc;cursor:pointer}.b.r{color:#b00;border-color:#d99}.tag{background:#ffd54f;border-radius:3px;padding:0 4px;font-size:11px}
input,select{padding:4px;font:inherit}.box{background:#fff;padding:12px;border:1px solid #d5dce6;border-radius:4px;margin-bottom:10px}#msg{position:fixed;right:12px;bottom:12px;background:#1c2430;color:#fff;padding:8px 12px;border-radius:4px;display:none}</style></head><body>
<header id=hdr>&#9881; Master Console</header><nav id=tabs></nav><div id=prefs style="padding:6px 16px;background:#f4f6fa;border-bottom:1px solid #d5dce6;font-size:12px"><label><input type=checkbox id=pInc> Incognito in rooms</label> &nbsp; <label><input type=checkbox id=pAnn> Announce my entry</label> <small style=color:#667>(masters enter/leave rooms silently unless announce is on)</small></div><main id=main>Loading...</main><div id=msg></div>
<script>
const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(u,b)=>{const r=await fetch('/api/master/'+u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||'Error '+r.status);throw j}return j};
const toast=t=>{$('msg').textContent=t;$('msg').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('msg').style.display='none',2500)};
if(new URLSearchParams(location.search).get('embed'))$('hdr').remove();
api('prefs').then(p=>{$('pInc').checked=p.incognito;$('pAnn').checked=p.announce});$('pInc').onchange=e=>api('prefs',{incognito:e.target.checked}).then(()=>toast(e.target.checked?'Incognito on':'Incognito off'));$('pAnn').onchange=e=>api('prefs',{announce:e.target.checked}).then(()=>toast('Saved'));
const T={Stats,Users,Rooms,Reports,'IP Bans':Ipb,Broadcast,Watching,Bots,Audit,Settings};let cur='Stats';
$('tabs').innerHTML=Object.keys(T).map(k=>`<button data-t="${k}">${k}</button>`).join('');document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cur=b.dataset.t;show()});
function show(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==cur));T[cur]()}
async function acct(name,action,extra){if(['delete','ban','revoke','grant','deactivate','clear-profile','clear-avatar'].includes(action)&&!confirm(action+' '+name+'?'))return;await api('account',{name,action,...extra});toast('Done: '+action+' '+name);show()}
async function Stats(){const d=await api('stats');$('main').innerHTML=`<div class=box style="display:flex;gap:18px;flex-wrap:wrap">${[['Online now',d.online],['Peak today',d.peak],['New sign-ups today',d.signupsToday],['New sign-ups this week',d.signupsWeek],['Rooms active',d.rooms]].map(([k,v])=>`<div style="min-width:130px"><div style="font-size:28px;font-weight:700">${v}</div><small>${k}</small></div>`).join('')}</div>`;$('main').insertAdjacentHTML('beforeend',`<div class=box><b>Password reset</b> (link always; email only if mail is configured)<br><input id=rsn placeholder="screen name"> <button id=rsb>Make link</button> <button id=rse>Email reset</button> <input id=rsl readonly style="width:55%"></div><div class=box><b>Create reserved account</b> (seed-list names only; becomes hidden master)<br><input id=crn placeholder="screen name"> <input id=crp type=password placeholder="password (8+)"> <button id=crb>Create</button></div><div class=box><b>Daily backups</b> (last 7 days, stored in the database) <button id=bkn>Back up now</button><div id=bkl></div></div>`);
$('crb').onclick=async()=>{try{const r=await api('create-reserved',{name:$('crn').value,password:$('crp').value});toast('Created '+r.name);$('crp').value=''}catch{}};$('rsb').onclick=async()=>{const r=await api('reset-link',{name:$('rsn').value});$('rsl').value=r.link||r.error||''};$('rse').onclick=async()=>{try{const r=await api('reset-link',{name:$('rsn').value,email:true});$('rsl').value=r.link||'';toast(r.sent?'Email sent':'Not sent')}catch{}};
const bk=async()=>{const l=await api('backups');$('bkl').innerHTML=(Array.isArray(l)?l:[]).map(b=>`<div>${b.d} &middot; ${Math.round(b.bytes/1024)} KB &middot; <a href="/api/master/backups/${b.d}" download>download JSON</a></div>`).join('')||'No backups yet.'};bk();$('bkn').onclick=async()=>{await api('backups',{});bk()};
clearTimeout(window._st);window._st=setTimeout(()=>cur=='Stats'&&document.activeElement.tagName!='INPUT'&&Stats(),30000)}
async function Users(){const d=await api('data');const q=(window._q||'');
 $('main').innerHTML=`<div class=box><b>Online guests:</b> ${d.guests.map(g=>E(g.name)+' <small>('+E(g.ip)+', '+E(g.loc)+(g.room?', '+E(g.room):'')+')</small> <button class="b r" data-ip="'+E(g.ip)+'">Ban IP</button>').join(' &middot; ')||'none'}</div>
 <input id=q placeholder="Filter accounts" value="${E(q)}"> <small>${d.accounts.length} accounts, ${d.accounts.filter(a=>a.online).length} online · emails, approximate IP location, and member tools below</small>
 <table><tr><th>Name</th><th>Status</th><th>Last IP / approx. location</th><th>Email</th><th>Actions</th></tr>${d.accounts.filter(a=>!q||a.name.toLowerCase().includes(q.toLowerCase())||String(a.email||'').toLowerCase().includes(q.toLowerCase())).map(a=>`<tr><td><b>${E(a.name)}</b> ${a.master?'<span class=tag>master</span>':''} ${d.banned.includes(a.name)?'<span class=tag style=background:#f88>banned</span>':''} ${(d.deactivated||[]).includes(a.name)?'<span class=tag style=background:#ccc>deactivated</span>':''}</td>
 <td>${a.online?'<span class=on>online</span>'+(a.room?' in '+E(a.room):''):'offline'}</td><td>${E(a.last_ip)}<br><small>${E(a.last_loc)||'—'}</small></td><td>${E(a.email)||'<i>—</i>'}</td>
 <td>${[['signout','Sign out'],[(d.deactivated||[]).includes(a.name)?'reactivate':'deactivate',(d.deactivated||[]).includes(a.name)?'Reactivate':'Deactivate'],[d.banned.includes(a.name)?'unban':'ban','Ban'+(d.banned.includes(a.name)?' (undo)':'')],['clear-profile','Clear text'],['clear-avatar','Clear photo'],['edit','Edit'],['reset','Reset link'],['reset-email','Email reset'],[a.master?'revoke':'grant',a.master?'Revoke master':'Grant master'],['delete','Delete']].map(([k,l])=>`<button class="b${/delete|ban|deactivate|clear/.test(k)?' r':''}" data-n="${E(a.name)}" data-a="${k}">${l}</button>`).join('')}${a.last_ip?`<button class="b r" data-ip="${E(a.last_ip)}">Ban IP</button>`:''}<button class=b onclick="watch('${E(a.name)}')">Watch</button></td></tr>`).join('')}</table>`;
 document.querySelectorAll('[data-ip]').forEach(b=>b.onclick=()=>ipban(b.dataset.ip));
 $('q').oninput=e=>{window._q=e.target.value;clearTimeout(window._qt);window._qt=setTimeout(Users,300)};
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const n=b.dataset.n,a=b.dataset.a;
  if(a=='edit'){const nn=prompt('New screen name (blank = keep):','');const em=prompt('Email (blank = keep):','');return acct(n,'edit',{newName:nn||undefined,email:em||undefined})}
  if(a=='reset'){const r=await api('reset-link',{name:n});prompt('Reset link (1 hour) — share privately:',r.link||'');return}
  if(a=='reset-email'){try{const r=await api('reset-link',{name:n,email:true});toast(r.sent?'Reset email sent':'Link ready (email not sent)');}catch(e){}return}
  acct(n,a)})}
async function ipban(ip){const r=prompt('Ban IP '+ip+'? Reason:','');if(r==null)return;await api('ipban',{ip,reason:r});toast('IP banned');show()}
async function watch(name){await api('watch',{name});toast('Watching '+name+' (silent)')}
async function Rooms(){const rs=await api('rooms');$('main').innerHTML=`<table><tr><th>Room</th><th>Settings</th><th>People</th><th>Moderate</th></tr>${rs.map(r=>`<tr data-r="${E(r.name)}"><td><b>${E(r.name)}</b><br><small>${E(r.cat)}${r.owner?' &middot; owner '+E(r.owner):''}</small><br><small>${E(r.topic)}</small></td>
 <td><select class=rt>${['PG-13','R'].map(x=>`<option ${x==r.rating?'selected':''}>${x}</option>`).join('')}</select> <select class=mc>${[1,2,3,4,5].map(n=>`<option value=${n} ${n==r.mics?'selected':''}>${n==1?'Single mic':'Mics: '+n}</option>`).join('')}</select><br><label><input type=checkbox class=hq ${r.hq?'checked':''}> Hands up</label> Timer <input class=tm size=4 value="${r.timer||''}" placeholder=off><br><button class="b tp">Set topic</button>${r.official?'':'<button class="b r cl">Close room</button>'}</td>
 <td>${r.people.map(E).join(', ')||'<i>empty</i>'}${r.mod&&r.mod.kicked.length?'<br><small>bounced/banned: '+r.mod.kicked.map(E).join(', ')+'</small>':''}${r.mod&&r.mod.dot&&r.mod.dot.length?'<br><small>dotted: '+r.mod.dot.map(E).join(', ')+'</small>':''}</td>
 <td><input class=who size=10 placeholder=name list=pl-${E(r.name)}><datalist id="pl-${E(r.name)}">${r.people.map(p=>`<option>${E(p)}</option>`).join('')}</datalist><br>${['kick','unkick','ban','unban','dot','undot','mutetext','unmutetext','mutemic','unmutemic','muteboth','unmuteall','admin','unadmin'].map(a=>(a=='dot'?'<select class=dm title="Dot duration"><option value=0>until lifted</option><option value=1>1 min</option><option value=5>5 min</option><option value=10>10 min</option><option value=30>30 min</option></select>':'')+`<button class="b ma" data-a=${a}>${({kick:'bounce',unkick:'unbounce'})[a]||a}</button>`).join('')}</td></tr>`).join('')}</table>`;
 document.querySelectorAll('tr[data-r]').forEach(tr=>{const room=tr.dataset.r,q=c=>tr.querySelector(c),P=b=>api('room',{room,...b}).then(()=>{toast('Saved');show()});
  q('.rt').onchange=e=>P({rating:e.target.value});q('.mc').onchange=e=>P({mics:+e.target.value});q('.hq').onchange=e=>P({hq:e.target.checked});q('.tm').onchange=e=>P({timer:e.target.value||0});
  q('.tp').onclick=()=>{const t=prompt('New topic for '+room);if(t)P({topic:t})};q('.cl')&&(q('.cl').onclick=()=>confirm('Close '+room+'?')&&P({close:true}));
  tr.querySelectorAll('.ma').forEach(b=>b.onclick=()=>{const who=q('.who').value.trim();if(!who)return toast('Enter a name');api('roommod',{room,action:b.dataset.a,who,mins:+q('.dm').value}).then(()=>{toast(b.textContent+' '+who);show()})})})}
async function Reports(){const rs=await api('reports');$('main').innerHTML=`<table><tr><th>When</th><th>By</th><th>Room</th><th>Reported</th><th>Why</th><th></th></tr>${rs.map(r=>`<tr style="${r.resolved?'opacity:.5':''}"><td>${new Date(r.at).toLocaleString()}</td><td>${E(r.by_name)}</td><td>${E(r.room)}</td><td><b>${E(r.who)}</b></td><td>${E(r.why)}</td><td>${r.resolved?'resolved'+(r.resolved_by?' by '+E(r.resolved_by):'')+` <button class=b onclick="api('report',{id:${r.id},resolved:false}).then(show)">Reopen</button>`:`<button class=b onclick="api('report',{id:${r.id}}).then(show)">Resolve</button>`}</td></tr>`).join('')||'<tr><td colspan=6>No reports.</td></tr>'}</table>`}
async function Ipb(){const d=await api('data');$('main').innerHTML=`<div class=box>IP <input id=ip> Reason <input id=rs> <button class="b r" id=go>Ban IP</button></div><table><tr><th>IP</th><th>Reason</th><th>Since</th><th></th></tr>${d.ipbans.map(b=>`<tr><td>${E(b.ip)}</td><td>${E(b.reason)}</td><td>${new Date(b.at).toLocaleString()}</td><td><button class=b onclick="api('ipban',{ip:'${E(b.ip)}',unban:true}).then(show)">Unban</button></td></tr>`).join('')||'<tr><td colspan=4>None.</td></tr>'}</table>`;
 $('go').onclick=()=>api('ipban',{ip:$('ip').value,reason:$('rs').value}).then(show)}
async function Settings(){const d=await api('unlimited'),bt=await api('bots');$('main').innerHTML=`<div class=box><b>Chat bots</b> (${bt.total})<br><small>Idle bots sit in a few rooms and post a casual line in the room's language every few minutes while people are there. They never answer IMs and don't count toward limits.</small><br><label><input type=checkbox id=bton ${bt.on?'checked':''}> Bots enabled (all rooms)</label><div style="max-height:220px;overflow:auto;margin-top:6px">${bt.rooms.map(r=>`<label style="display:block"><input type=checkbox class=btr data-r="${E(r.room)}" ${r.on?'checked':''}> ${E(r.room)} <small>(${r.bots.map(E).join(', ')})</small></label>`).join('')}</div></div><div class=box><b>Unlimited-screen-name emails</b><br><small>Every other email may have only one screen name (Gmail dots and +tags count as the same address). One per line.</small><br><textarea id=ue rows=6 cols=50>${E(d.emails.join('\n'))}</textarea><br><button class=b id=ues>Save</button></div>`;$('bton').onchange=e=>api('bots',{on:e.target.checked}).then(r=>toast('Bots '+(r.on?'on':'off')));document.querySelectorAll('.btr').forEach(c=>c.onchange=()=>api('bots',{room:c.dataset.r,on:c.checked}).then(()=>toast(c.dataset.r+': bots '+(c.checked?'on':'off'))));$('ues').onclick=()=>api('unlimited',{emails:$('ue').value}).then(r=>{toast('Saved ('+r.emails.length+')');Settings()})}
function Broadcast(){$('main').innerHTML=`<div class=box>System message to every room and every Messenger user:<br><textarea id=bt rows=3 cols=70 maxlength=300></textarea><br><button class="b r" id=go>Broadcast</button></div>`;$('go').onclick=()=>{if($('bt').value.trim()&&confirm('Send to everyone?'))api('broadcast',{text:$('bt').value}).then(()=>{toast('Sent');$('bt').value=''})}}
async function Watching(){const w=await api('watch');$('main').innerHTML=`<div class=box>Silent watch list (the person is never notified). Add <input id=wn> <button class=b id=go>Watch</button></div><table><tr><th>Name</th><th>Status</th><th>Room</th><th>Message</th><th>IP / location</th><th></th></tr>${w.map(x=>`<tr><td>${E(x.name)}</td><td>${x.online?'<span class=on>'+E(x.status)+'</span>':'offline'}</td><td>${E(x.room)}</td><td>${E(x.msg)}</td><td>${E(x.ip)}<br><small>${E(x.loc)}</small></td><td><button class=b onclick="api('watch',{name:'${E(x.name)}',remove:true}).then(show)">Remove</button></td></tr>`).join('')}</table>`;$('go').onclick=()=>api('watch',{name:$('wn').value}).then(show)}
async function Bots(){const d=await api('bot-profiles');const bots=d.bots||[];
 $('main').innerHTML=`<div class=box><b>Bot profiles</b> (${bots.length}, master session only)<br><small>These are <b>not</b> login accounts. There is no universal bot password. Edit any bot's display name, bio, location and interests below. To replace an avatar (for example an image you made in ChatGPT), click <b>Upload image</b> on that row. Public profiles show these like a normal member profile.</small><br>Filter <input id=bf placeholder="name, room, language"></div>
 <table id=bt><tr><th>Avatar</th><th>Screen name</th><th>Profile</th><th>Room</th><th></th></tr>${bots.map(b=>`<tr data-id="${E(b.id)}" data-q="${E((b.name+' '+b.room+' '+b.display_name+' '+b.location).toLowerCase())}">
 <td><img class=bav src="/bot-av/${E(b.id)}?t=${Date.now()}" width=48 height=48 style="border-radius:8px;object-fit:cover" alt=""><br><small>${b.uploaded?'uploaded':(b.avatar?E(b.avatar):'placeholder')}</small></td>
 <td><b>${E(b.name)}</b><br><small>id ${E(b.id)}</small>${b.interactive?'<br><span class=tag style=background:#e3eef9>host</span>':''}</td>
 <td><input class=f-dn maxlength=40 value="${E(b.display_name)}" placeholder="Display name" style="width:96%"><br><textarea class=f-bio maxlength=300 rows=2 style="width:96%">${E(b.bio)}</textarea><br>
 <input class=f-loc maxlength=50 value="${E(b.location)}" placeholder="Location" style="width:46%"> <input class=f-int maxlength=150 value="${E(b.interests)}" placeholder="Interests" style="width:48%"><br><small>${b.updated_by?'edited by '+E(b.updated_by):'default profile'}</small></td>
 <td>${E(b.room)}</td>
 <td><button class="b sv">Save</button><br><label class=b style="display:inline-block;margin-top:4px;cursor:pointer">Upload image<input type=file class=up accept="image/png,image/jpeg,image/webp" hidden></label>${b.uploaded?'<br><button class="b rm" style="margin-top:4px">Remove image</button>':''}</td></tr>`).join('')||'<tr><td colspan=5>No bot profiles yet (they seed on server start).</td></tr>'}</table>
 <div class=box><small>Optional built-in avatar keys: ${(d.assets||[]).map(a=>`<code>${E(a)}</code>`).join(', ')||'none'}</small></div>`;
 $('bf').oninput=e=>{const v=e.target.value.toLowerCase();document.querySelectorAll('#bt tr[data-id]').forEach(r=>r.style.display=r.dataset.q.includes(v)?'':'none')};
 document.querySelectorAll('#bt tr[data-id]').forEach(tr=>{const id=tr.dataset.id,v=c=>tr.querySelector(c).value;
  tr.querySelector('.sv').onclick=async()=>{await api('bot-profiles',{id,displayName:v('.f-dn'),bio:v('.f-bio'),location:v('.f-loc'),interests:v('.f-int')});toast('Bot profile saved')};
  tr.querySelector('.up').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>600*1024)return toast('Image must be under 600 KB');const rd=new FileReader();rd.onload=async()=>{await api('bot-avatar',{id,data:rd.result});toast('Avatar updated');Bots()};rd.readAsDataURL(f)};
  const rm=tr.querySelector('.rm');if(rm)rm.onclick=async()=>{await api('bot-avatar',{id,remove:true});toast('Avatar removed');Bots()}})}
async function Audit(){const rows=await api('audit');$('main').innerHTML=`<div class=box><b>Master audit log</b> (recent mutations)</div><table><tr><th>When</th><th>By</th><th>Action</th><th>Target</th><th>Detail</th></tr>${(rows||[]).map(r=>`<tr><td>${new Date(r.at).toLocaleString()}</td><td>${E(r.by_name)}</td><td>${E(r.action)}</td><td>${E(r.target)}</td><td>${E(r.detail)}</td></tr>`).join('')||'<tr><td colspan=5>No audit entries yet.</td></tr>'}</table>`}

show();
</script></body></html>
