<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Razzle Administration</title>
<style>body{font:14px system-ui,Arial;margin:0;background:#f4f7fb;color:#10234a}header{background:linear-gradient(90deg,#4AB7F2,#1877E8);color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center}
header b{font-size:18px}main{padding:16px 20px}input{padding:8px 12px;border:1px solid #c9d6ea;border-radius:10px;font:inherit}button{padding:8px 14px;border:0;border-radius:10px;background:#1877E8;color:#fff;cursor:pointer}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(16,35,74,.08);padding:14px;margin-bottom:16px;overflow:auto}h2{font-size:15px;margin:0 0 8px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #eef2f8;vertical-align:top;white-space:nowrap}th{color:#5a6b8a;font-size:12px;text-transform:uppercase}
.on{color:#1a9a4a;font-weight:600}.off{color:#999}details{font-size:12px}.sm{color:#5a6b8a;font-size:12px}#gate{max-width:360px;margin:80px auto;text-align:center}</style></head><body>
<header><b>Razzle Administration</b><span class=sm style="color:#e8f3ff">Owner only &middot; IPs and locations are private</span><span style="flex:1"></span><input id=q placeholder="Search name, IP, location..." style="width:280px"><button id=rf>Refresh</button><button id=lo style="background:#10234a">Lock</button></header>
<div id=gate><h2>Enter admin key</h2><input id=k type=password style="width:100%"><br><br><button id=go>Unlock</button><p id=er style="color:#c0392b"></p></div>
<main id=app hidden><div class=card><h2>Chat rooms (ratings)</h2><table id=tR></table></div><div class=card><h2>Online now</h2><table id=tOn></table></div><div class=card><h2>Accounts</h2><table id=tA></table></div><div class=card><h2>Guests (this server session)</h2><table id=tG></table></div><div class=card><h2>Guest sign-in log (database)</h2><table id=tL></table></div></main>
<script>
const $=i=>document.getElementById(i),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dt=t=>t?new Date(t).toLocaleString():'';let D=null;
async function load(){const k=sessionStorage.getItem('yk');if(!k)return;const r=await fetch('/api/admin/data',{headers:{'x-admin-key':k}});const j=await r.json().catch(()=>({}));
 if(!r.ok){sessionStorage.removeItem('yk');$('gate').hidden=false;$('app').hidden=true;$('er').textContent=j.error||'Error';return}D=j;D.rooms=await fetch('/api/admin/rooms',{headers:{'x-admin-key':k}}).then(r=>r.json()).catch(()=>[]);$('gate').hidden=true;$('app').hidden=false;draw()}
async function roomAct(b){const k=sessionStorage.getItem('yk');if(b.close&&!confirm('Close room '+b.room+'? Everyone in it is moved to the Lobby.'))return;
 const r=await fetch('/api/admin/room',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':k},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)alert(j.error||'Failed');load()}
function draw(){$('tR').innerHTML='<tr><th>Room<th>Owner<th>Users<th>Rating<th></tr>'+(D.rooms||[]).map((r,i)=>`<tr><td><b>${e(r.name)}</b>${r.official?' <span class=sm>(official)</span>':''}<td>${e(r.owner||'')}<td>${r.count}<td><select data-i=${i}>${['PG-13','R'].map(x=>`<option${x==r.rating?' selected':''}>${x}</option>`).join('')}</select><td>${r.official?'':`<button data-c=${i}>Close room</button>`}`).join('');
 $('tR').querySelectorAll('select').forEach(x=>x.onchange=()=>roomAct({room:D.rooms[x.dataset.i].name,rating:x.value}));$('tR').querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>roomAct({room:D.rooms[x.dataset.c].name,close:true}));
const q=$('q').value.toLowerCase(),m=o=>!q||JSON.stringify(o).toLowerCase().includes(q);
 const A=D.accounts.filter(m),G=D.guests.filter(m),L=D.guestLog.filter(m);
 const on=[...D.accounts.filter(a=>a.online).map(a=>({t:'Account',name:a.name,ip:a.last_ip,loc:a.last_loc,at:a.last_at})),...D.guests.filter(g=>g.online).map(g=>({t:'Guest',name:g.name,ip:g.ip,loc:g.loc,at:g.at}))].filter(m);
 $('tOn').innerHTML='<tr><th>Type<th>Name<th>IP<th>Location<th>Since</tr>'+(on.map(o=>`<tr><td>${o.t}<td class=on>${e(o.name)}<td>${e(o.ip)}<td>${e(o.loc||'(unknown)')}<td>${dt(o.at)}`).join('')||'<tr><td colspan=5 class=sm>Nobody online');
 $('tA').innerHTML='<tr><th>Name<th>Status<th>Last IP<th>Location<th>Last seen<th>Created<th>Email<th>History</tr>'+(A.map(a=>`<tr><td><b>${e(a.name)}</b><td class=${a.online?'on':'off'}>${a.online?'online':'offline'}<td>${e(a.last_ip)}<td>${e(a.last_loc||(a.last_ip?'(lookup failed)':''))}<td>${dt(a.last_at)}<td>${dt(a.created)}<td>${e(a.email)}<td><details><summary>${a.hist.length} logins</summary>${a.hist.map(h=>`${dt(h.at)} &middot; ${e(h.kind)} &middot; ${e(h.ip)} &middot; ${e(h.loc)}`).join('<br>')}</details>`).join('')||`<tr><td colspan=8 class=sm>${D.db?'No accounts':'Database not connected'}`);
 $('tG').innerHTML='<tr><th>Name<th>Status<th>IP<th>Location<th>Signed in<th>Left</tr>'+(G.map(g=>`<tr><td><b>${e(g.name)}</b><td class=${g.online?'on':'off'}>${g.online?'online':'left'}<td>${e(g.ip)}<td>${e(g.loc||'(unknown)')}<td>${dt(g.at)}<td>${dt(g.left)}`).join('')||'<tr><td colspan=6 class=sm>No guests yet');
 $('tL').innerHTML='<tr><th>Name<th>IP<th>Location<th>Time</tr>'+(L.map(g=>`<tr><td>${e(g.name)}<td>${e(g.ip)}<td>${e(g.loc)}<td>${dt(g.at)}`).join('')||'<tr><td colspan=4 class=sm>Empty')}
$('go').onclick=()=>{sessionStorage.setItem('yk',$('k').value);load()};$('k').onkeydown=x=>x.key=='Enter'&&$('go').onclick();$('q').oninput=()=>D&&draw();$('rf').onclick=load;$('lo').onclick=()=>{sessionStorage.removeItem('yk');location.reload()};
load();setInterval(()=>D&&load(),30000);
</script></body></html>
