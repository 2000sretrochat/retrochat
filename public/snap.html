<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YappChat - Phone Photo</title><link rel="icon" href="/icon-192.png">
<style>body{margin:0;font:16px system-ui,-apple-system,Segoe UI,Arial;background:linear-gradient(#0033A0,#00205B);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;box-sizing:border-box}
.c{background:#fff;color:#00205B;border-radius:20px;padding:22px;max-width:360px;width:100%;box-sizing:border-box;box-shadow:0 10px 30px #0006}h1{font-size:20px;margin:0 0 6px}p{color:#4a5a78;font-size:14px}
.b{display:block;width:100%;box-sizing:border-box;padding:15px;border:0;border-radius:14px;background:#00A3E0;color:#fff;font:700 17px inherit;margin-top:12px;cursor:pointer}.b.alt{background:#e6f4fb;color:#0033A0}
canvas{width:200px;height:200px;border-radius:50%;margin:10px auto;display:block;background:#e6f4fb}.e{color:#c22;font-size:14px;min-height:18px}</style></head><body>
<div class=c><h1>Snap your avatar</h1><p id=who>Checking your link...</p><canvas id=cv width=192 height=192></canvas>
<p id=tip style="display:none;font-size:13px">Tip: save your Bitmoji or snap to your camera roll first (in Snapchat tap it, then <b>Save</b>).</p><label class=b id=take>Take a selfie<input id=f type=file accept="image/*" capture="user" hidden></label><label class="b alt">Choose from photos<input id=g type=file accept="image/*" hidden></label>
<button class=b id=up style="display:none;background:#0033A0">Use this photo</button><div class=e id=e></div></div>
<script>
const t=new URLSearchParams(location.search).get('t')||'',$=i=>document.getElementById(i),cv=$('cv'),cx=cv.getContext('2d');let ok=false;const M=new URLSearchParams(location.search).get('m');if(M=='bm'){document.querySelector('h1').textContent='Snapchat / Bitmoji avatar';$('tip').style.display='';const L=document.querySelectorAll('label.b');L[1].firstChild.textContent='Choose from Snapchat / Photos';L[1].className='b';L[0].className='b alt';L[0].parentNode.insertBefore(L[1],L[0])}
fetch('/snapchk?t='+encodeURIComponent(t)).then(r=>r.json()).then(r=>{if(r.error){$('who').textContent=r.error;document.querySelectorAll('label').forEach(l=>l.style.display='none')}else $('who').textContent='Avatar for '+r.name+'. Take a selfie or pick a photo.'});
async function pick(f){if(!f)return;$('e').textContent='';try{const b=await createImageBitmap(f,{imageOrientation:'from-image'}),s=Math.min(b.width,b.height);cx.fillStyle='#fff';cx.fillRect(0,0,192,192);cx.drawImage(b,(b.width-s)/2,(b.height-s)/2,s,s,0,0,192,192);ok=true;$('up').style.display=''}catch{$('e').textContent='Could not read that photo.'}}
$('f').onchange=e=>pick(e.target.files[0]);$('g').onchange=e=>pick(e.target.files[0]);
$('up').onclick=async()=>{if(!ok)return;const c=document.createElement('canvas');c.width=c.height=96;c.getContext('2d').drawImage(cv,0,0,96,96);let q=.85,d;do{d=c.toDataURL('image/jpeg',q);q-=.1}while(d.length>40000&&q>.3);
 $('up').disabled=true;$('up').textContent='Uploading...';const r=await fetch('/snapup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t,img:d})}).then(r=>r.json()).catch(()=>({error:'Network error'}));
 if(r.error){$('e').textContent=r.error;$('up').disabled=false;$('up').textContent='Use this photo'}else{document.querySelector('.c').innerHTML='<h1>Picture updated! &#10003;</h1><p>Your new avatar is showing on your computer now. You can close this page.</p>'}};
</script></body></html>
